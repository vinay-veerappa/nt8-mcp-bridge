# ACTIVE since 2026-08-13. It sat parked at ci/github-workflow-ci.yml for a day
# because the `gh` OAuth token lacks the `workflow` scope, and GitHub refuses any
# HTTPS push that writes under .github/workflows/ without it. Fixed by pushing over
# SSH instead, which is not an OAuth App push -- see nt8-riskguard's handover, 5.11.
#
# The second step is the interesting one: it proves deploy.py REFUSES rather than
# trusting the comment that says it does. Verified locally before activation --
# hiding the vendored core makes --dry-run exit exactly 2.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # windows-latest, not ubuntu: the harness targets net8.0-windows with UseWPF,
    # and NinjaTrader is Windows-only. Proving this builds on Linux would prove
    # something about the runner, not about the product.
    runs-on: windows-latest
    steps:
      # The vendored core is a compile-time dependency, so the submodule is not
      # optional here either.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # ⚠️ Session 38 fixed the INSTANCE -- two unwired batteries -- by adding two steps
      # by hand, which leaves a third free to arrive unwired for just as long. This is
      # the class: it globs mutation/ and fails if any battery is not run exactly once.
      # Ported from the core, where it has existed since session 20; it is per-repo by
      # construction, so it could never have seen this side. Watched failing on a
      # battery described in a comment but not run.
      - name: CI runs every mutation battery
        run: python tools/check_ci_runs_every_battery.py

      # ⚠️ Ported from nt8-riskguard in session 42, AFTER it was needed here. A battery whose
      # find-string stops matching prints [SKIP] and scores that mutant a SURVIVOR -- but only
      # when the battery is RUN, which is minutes of `dotnet build`. P3-111 moved the parse
      # arithmetic out of BridgeOrderQuery.cs and broke SIX of mutate_p2109.py's anchors; the
      # only thing that noticed was running the battery by hand, 6/12, minutes spent proving
      # nothing. In the core repo the same edit fails in the commit that makes it.
      #
      # THIRD per-repo gate found missing on this side, after check_ci_runs_every_battery.py and
      # check_expected_survivors.py. A gate is per-repo: writing one where you found the defect
      # leaves the other side unguarded. This is a substring count, so it runs before everything.
      - name: Mutation anchors still match (a stale anchor scores a survivor)
        run: python tools/check_anchors.py

      - name: Harness
        run: dotnet run --project tests/BridgeTests.csproj

      # The MCP wrapper (mcp/) is the other half of the contract: it advertises
      # tool schemas, the addon decides what it accepts. P1-91 and P1-72 (twice)
      # were found in the wrapper repo, which had NO CI -- 43 tests nothing ran on
      # push. The wrapper is now folded into this repo (see PR for this branch),
      # so its tests run here. The P1-72 test reads addons/McpBridgeAddOn.cs
      # directly, which is why the JS step MUST run after checkout with submodules
      # and cannot be split to a separate job without the addon source.
      - name: MCP wrapper tests (JS)
        working-directory: mcp
        run: node --test

      # ⚠️ Added 2026-08-14 (session 38). This repo has had a mutation battery since
      # P1-90 and CI RAN NONE OF THEM -- the core's check_ci_runs_every_battery.py
      # only knows about the core's, so nothing was watching this side. A battery
      # nobody runs is a file, and this is the same class as the two batteries that
      # were unpassable for 10 pushes (nt8-riskguard handover 5.38).
      #
      # They are cheap here in a way they are not in the core: the harness is a small
      # project, so a mutant costs seconds rather than a full addon recompile. Listed
      # one step per battery so a failure names which one.
      # ⚠️ BEFORE the batteries, because it decides whether they can run at all. All four
      # captured their child's output with the Windows locale codec, so one non-ASCII
      # character in a test name made stdout None and the battery died before its first
      # mutant. A bulk fix patched three and printed SKIP for the fourth; the skip was read
      # and not acted on, and this workflow went red on the next push.
      - name: Every battery pins an explicit encoding (or none of them prove anything)
        run: python tools/check_batteries_pin_encoding.py

      - name: Mutation P1-90 (the account resolver)
        run: python mutation/mutate_p190.py

      - name: Mutation P0-104 (the emergency flatten's cancel set)
        run: python mutation/mutate_p0104.py

      - name: Mutation P1-106 (the lockout that trapped you in the position)
        run: python mutation/mutate_p1106.py

      # ⚠️ 15/18 on its first run, and all three survivors were real. Two of them were
      # SOURCE gates that passed under the mutant because they asserted a value is
      # COMPUTED rather than USED -- neutering `if (closeResolution.Refused)` to
      # `if (false)` left the ResolveOrRefuse call in place and the gate still said ok.
      # Do not read a clean first run here as a strong result; read it as the moment to
      # add a mutant you expect to survive.
      - name: Mutation P1-105 (the close that reported an outcome it never observed)
        run: python mutation/mutate_p1105.py

      # ⚠️ 11/12 first run, and the survivor was the SAME gate weakness P1-105's battery had
      # found hours earlier -- a source assertion that the resolver is CALLED, which passes
      # when the refusal is neutered to `if (false)`. Fixed by a sweep that derives the check
      # from the source, so a ninth resolver site is covered the moment it is written.
      - name: Mutation P2-109 (the orders filter that filtered nothing)
        run: python mutation/mutate_p2109.py

      # ⚠️ 9/10 first run, and the survivor was the AUTHOR again -- a mutant named "the route
      # parses at the seam" that passed `query["count"] ?? "100"`, still a string, still handed
      # to the safe parser. It never expressed the defect, so no test could kill it and none was
      # missing. The filed defect is now UNREPRESENTABLE: GetBars takes no int, so int.Parse at
      # the route does not compile. Second instance of P1-99's lesson -- a surviving mutant does
      # not always mean a missing test.
      - name: Mutation P3-111 (the bars endpoint that crashed, flooded and ignored its offset)
        run: python mutation/mutate_p3111.py

      # P2-115. `/api/health`'s feedConnected was `Account.All.Count > 0` -- true on every running
      # NT8, forever. Measured reading `true` against a DORMANT Playback connection with no
      # tradeable market at all, and `true` again an hour later with a real broker: it did not
      # change value when the thing it names changed completely.
      # ⚠️ 5/10 ON THE FIRST RUN, and four of the five were gaps in tests written the same hour:
      # null arrays vs EMPTY arrays (an empty array is not a null one), a blank provider, ragged
      # arrays, and a source gate asserting the class is MENTIONED rather than that its answer is
      # ASSIGNED -- the third time that exact gap has been found here after P1-105 and P2-109.
      # The fifth was the author's: a case-SENSITIVE Contains("Connected") mutant, which
      # "Disconnected" does not match, so it never expressed its own defect.
      # ⚠️ Mutant 5 is the one to know: a bare `return false`. Every requirement in this ticket is
      # about a TRUE that cannot become false, so a constant false satisfies all of them and would
      # ship a permanent-outage report on a working box. The positive control is what bans it.
      - name: Mutation P2-115 (a health flag that could never be false)
        run: python mutation/mutate_p2115.py

      # Proves deploy.py refuses to half-deploy rather than trusting the comment
      # that says it does. Exit 2 is the refusal; anything else is a regression.
      - name: Deploy tool refuses to deploy without the core
        shell: bash
        run: |
          mv vendor/nt8-riskguard vendor/_hidden
          set +e
          python tools/deploy.py --dry-run
          code=$?
          set -e
          mv vendor/_hidden vendor/nt8-riskguard
          if [ "$code" != "2" ]; then
            echo "expected exit 2 (refusal), got $code"
            exit 1
          fi
          echo "OK: refused to half-deploy"

# Deploy parity (tools/deploy.py --verify) is NOT run here: it compares against
# %USERPROFILE%/Documents/NinjaTrader 8/, which exists only on the trading machine.
# On a hosted runner it would pass vacuously, and a green check that proves nothing
# is worse than an absent one. Run it locally before and after every deploy.
