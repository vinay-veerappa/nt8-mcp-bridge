# ACTIVE since 2026-08-13. It sat parked at ci/github-workflow-ci.yml for a day
# because the `gh` OAuth token lacks the `workflow` scope, and GitHub refuses any
# HTTPS push that writes under .github/workflows/ without it. Fixed by pushing over
# SSH instead, which is not an OAuth App push -- see nt8-riskguard's handover, 5.11.
#
# The second step is the interesting one: it proves deploy.py REFUSES rather than
# trusting the comment that says it does. Verified locally before activation --
# hiding the vendored core makes --dry-run exit exactly 2.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # windows-latest, not ubuntu: the harness targets net8.0-windows with UseWPF,
    # and NinjaTrader is Windows-only. Proving this builds on Linux would prove
    # something about the runner, not about the product.
    runs-on: windows-latest
    steps:
      # The vendored core is a compile-time dependency, so the submodule is not
      # optional here either.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Harness
        run: dotnet run --project tests/BridgeTests.csproj

      # ⚠️ Added 2026-08-14 (session 38). This repo has had a mutation battery since
      # P1-90 and CI RAN NONE OF THEM -- the core's check_ci_runs_every_battery.py
      # only knows about the core's, so nothing was watching this side. A battery
      # nobody runs is a file, and this is the same class as the two batteries that
      # were unpassable for 10 pushes (nt8-riskguard handover 5.38).
      #
      # They are cheap here in a way they are not in the core: the harness is a small
      # project, so a mutant costs seconds rather than a full addon recompile. Listed
      # one step per battery so a failure names which one.
      - name: Mutation P1-90 (the account resolver)
        run: python mutation/mutate_p190.py

      - name: Mutation P0-104 (the emergency flatten's cancel set)
        run: python mutation/mutate_p0104.py

      # Proves deploy.py refuses to half-deploy rather than trusting the comment
      # that says it does. Exit 2 is the refusal; anything else is a regression.
      - name: Deploy tool refuses to deploy without the core
        shell: bash
        run: |
          mv vendor/nt8-riskguard vendor/_hidden
          set +e
          python tools/deploy.py --dry-run
          code=$?
          set -e
          mv vendor/_hidden vendor/nt8-riskguard
          if [ "$code" != "2" ]; then
            echo "expected exit 2 (refusal), got $code"
            exit 1
          fi
          echo "OK: refused to half-deploy"

# Deploy parity (tools/deploy.py --verify) is NOT run here: it compares against
# %USERPROFILE%/Documents/NinjaTrader 8/, which exists only on the trading machine.
# On a hosted runner it would pass vacuously, and a green check that proves nothing
# is worse than an absent one. Run it locally before and after every deploy.
