<!DOCTYPE html>
<!--
  RiskGuard — the rule inventory.

  WHAT THIS PAGE IS FOR, IN ONE SENTENCE: to answer "is this limit actually
  protecting me?" with something derived, rather than with the contents of a
  config file.

  It is deliberately NOT a dashboard. There are no charts, no gauges and no
  colours that mean "good". Every row is a comparison between what was
  CONFIGURED and what is actually happening, and the only thing the page adds
  is ordering: the worst states sort first, because the whole reason this
  exists is that three real defects (P1-77, P2-25, P2-78) were invisible in a
  file that read as protection.

  No framework, no build step, no network beyond localhost. See
  docs/UI_REDESIGN_DESIGN.md §7 in nt8-riskguard for why it is a browser page
  and not WPF: every line of UI code compiled into NT8 is a line that can stop
  the risk guard from loading.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RiskGuard — rule inventory</title>
<style>
  :root {
    --bg: #16181c; --panel: #1e2126; --line: #2c3038;
    --text: #e7e9ee; --dim: #949aa6;
    --red: #ff6b6b; --amber: #ffb454; --green: #63c98d; --grey: #6e7682;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .meta { color: var(--dim); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 600; }
  main { padding: 16px 20px 40px; }
  section { margin-bottom: 26px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td {
    text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .state { font-weight: 600; white-space: nowrap; }
  .s-ConfiguredNotEvaluated, .s-Inert { color: var(--red); }
  .s-EvaluatedNotEnforcing { color: var(--amber); }
  .s-Enforcing { color: var(--green); }
  .s-Disabled { color: var(--grey); }
  .v-Orphan, .v-Diverged { color: var(--red); }
  .v-Quarantined { color: var(--amber); }
  .v-Shadow { color: var(--amber); }
  .v-Match, .v-Idle { color: var(--green); }
  .pos { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bad { color: var(--red); }
  .note { color: var(--dim); font-size: 12px; }
  .path { color: var(--dim); font-family: Consolas, monospace; font-size: 11px; }
  .banner {
    padding: 10px 14px; border-radius: 4px; margin-bottom: 16px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .banner.bad { border-color: var(--red); color: var(--red); }
  button, input {
    font: inherit; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  .legend { color: var(--dim); font-size: 12px; margin-top: 6px; }
  tr.acct { cursor: pointer; }
  tr.acct:hover { background: #23272e; }
  .note.clamp {
    max-height: 2.9em; overflow: hidden; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .note.clamp:hover { color: var(--text); }
  .filter { margin-bottom: 10px; }
  .filter a { color: var(--amber); cursor: pointer; text-decoration: underline; }
  .chip {
    display: inline-block; padding: 1px 7px; margin-right: 5px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--line);
  }
  .legend span { margin-right: 14px; white-space: nowrap; }
  .act { padding: 3px 8px; font-size: 12px; margin-right: 5px; white-space: nowrap; }
  .act[disabled] { opacity: .4; cursor: not-allowed; }
  .act.warn { border-color: var(--amber); color: var(--amber); }
  /* P2-126. Inline row editing (ratio + sizing mode) and the group cards. The
     rowedit sits inside the Actions cell so the frequent actions stay on the row
     (section 4 decision 3) and the set-rarely config stays in the inspector. */
  .rowedit { display: flex; gap: 4px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
  .rowedit input.ratio { width: 64px; padding: 2px 4px; }
  .rowedit select.sizing { width: 120px; padding: 2px 4px; }
  .groupcard { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
               margin-bottom: 8px; background: var(--panel); }
  .groupcard ul { margin: 6px 0; padding-left: 18px; }
  .groupcard .cfgbar { margin-top: 6px; }
  .groupcard select.addfollower { width: 180px; padding: 2px 4px; }
  .banner.ok { border-color: var(--green); }
  /* P1-125. The system row's severity vocabulary, and it is the ONLY thing this page
     decides about the copier's state: the name comes from CopierEnforcementView, which
     is in the test build, and all that happens here is a colour. Deliberately a NAME and
     not a number -- the rows in the same payload carry a numeric `severity` whose 0 is
     the WORST, and keying a colour off the wrong polarity would paint an orphan green. */
  .sev-ok { color: var(--green); }
  .sev-info { color: var(--dim); }
  .sev-warn { color: var(--amber); }
  .sev-critical { color: var(--red); }
  .banner.warn { border-color: var(--amber); }
  .banner .detail { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .banner .dismiss { float: right; padding: 1px 8px; font-size: 12px; }
  .banner .reason {
    display: block; margin-top: 6px; color: var(--text);
    font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap;
  }

  /* The editable config form. Deliberately the same table as everything else --
     an input that looks like a control invites clicking; one that looks like the
     value it replaced invites reading first. */
  .cfg td { vertical-align: middle; }
  .cfg input, .cfg select { width: 150px; padding: 3px 6px; }
  .cfg input.dirty, .cfg select.dirty { border-color: var(--amber); color: var(--amber); }
  .cfg .k { font-family: Consolas, monospace; font-size: 11px; color: var(--dim); }
  .cfg .was { color: var(--dim); font-size: 12px; }
  .cfg tr.grp td { background: #23272e; color: var(--dim); font-size: 11px;
                   text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .cfgbar { margin: 10px 0 0; display: flex; gap: 8px; align-items: center; }
  .cfgbar .note { margin-left: auto; }

  /* P2-138. Section 4's two panes. The fleet is ALWAYS visible and the inspector
     is what the selection drives -- that is the whole layout, and the reason the
     page needs no navigation tabs. */
  .shell { display: flex; gap: 16px; align-items: flex-start; }
  #fleetpane { flex: 0 0 300px; width: 300px; position: sticky; top: 8px; }
  #inspector { flex: 1; min-width: 0; }
  /* P2-127 slice 3. The tab strip is ALWAYS visible; only the PANES swap. That is
     the difference between these and the top-level nav tabs section 4.2 killed: a
     warning on an unselected tab is still on screen, in its badge. */
  #tabstrip { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
  .tab { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px;
         border: 1px solid #333; border-radius: 4px 4px 0 0; cursor: pointer;
         background: #1b1b1b; }
  .tab.on { background: #262626; border-bottom-color: #262626; font-weight: 600; }
  .tab .tbadge { font-size: 11px; opacity: 0.95; }
  /* Worst-first colouring, from the RANK the class computed -- never re-derived here. */
  .tab.r0 { border-color: #a33; } .tab.r0 .tbadge { color: #ff8a8a; }
  .tab.r1 { border-color: #a63; } .tab.r1 .tbadge { color: #ffbe76; }
  .tab.r2, .tab.r3 { border-color: #886; } .tab.r2 .tbadge, .tab.r3 .tbadge { color: #ddd18a; }
  .tab.r5 .tbadge { color: #8ad18a; }

  /* P2-127 slice 4. Section 4 decision 4's system row, and section 4's bottom EVENTS
     region. The `.shell` above is a flex ROW, so the events pane takes the full width
     by breaking the row -- section 4's ASCII drawing has it spanning both panes. */
  .shell { flex-wrap: wrap; }
  #eventspane { flex: 1 1 100%; width: 100%; margin-top: 14px;
                border-top: 1px solid #333; padding-top: 8px; }
  .paneheader { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
                color: var(--dim); margin-bottom: 6px; }
  .scopenote { margin-left: 8px; text-transform: none; letter-spacing: 0; }
  #systemrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  .scell { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px;
           border: 1px solid #333; border-radius: 4px; background: #1b1b1b; }
  .scell .slabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
                   color: var(--dim); }
  .scell .sbadge { font-size: 12px; font-weight: 600; }
  /* Same rank-driven colouring as the tabs, from the SAME scale, and never re-derived
     here: two severity scales on one page is two things to keep in step. */
  .scell.r0 { border-color: #a33; } .scell.r0 .sbadge { color: #ff8a8a; }
  .scell.r1 { border-color: #a63; } .scell.r1 .sbadge { color: #ffbe76; }
  .scell.r2, .scell.r3 { border-color: #886; }
  .scell.r2 .sbadge, .scell.r3 .sbadge { color: #ddd18a; }
  .scell.r5 { border-color: #4a6; } .scell.r5 .sbadge { color: #8ad18a; }
  #events table { width: 100%; border-collapse: collapse; }
  #events td { padding: 2px 8px 2px 0; vertical-align: top; border-bottom: 1px solid #262626; }
  #events .ewhen { color: var(--dim); font-family: Consolas, monospace; font-size: 11px;
                   white-space: nowrap; }
  #events .ewho { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #events .etype { font-family: Consolas, monospace; font-size: 11px; white-space: nowrap; }
  #events .emsg { font-size: 12px; }
  #events .ecount { font-size: 11px; color: var(--dim); white-space: nowrap; }
  #events tr.r0 .etype { color: #ff8a8a; font-weight: 600; }
  #events tr.r1 .etype { color: #ffbe76; }
  #events tr.r2 .etype, #events tr.r3 .etype { color: #ddd18a; }
  #events tr.r5 .etype { color: #8ad18a; }
  #fleettree ul { list-style: none; margin: 0; padding: 0; }
  #fleettree li { padding: 0; margin: 0; }
  .fnode { display: flex; align-items: baseline; gap: 6px; padding: 3px 6px;
           border-radius: 3px; cursor: pointer; }
  .fnode:hover { background: rgba(255,255,255,0.06); }
  .fnode.sel { background: rgba(255,255,255,0.14); font-weight: 600; }
  .fnode .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fnode .fbadge { font-size: 11px; opacity: 0.85; white-space: nowrap; }
  .fkids { margin-left: 14px; border-left: 1px solid rgba(255,255,255,0.12); padding-left: 6px; }
  .fgroup { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
            opacity: 0.7; margin-top: 10px; }
  /* The badge is coloured by the NAME core sent, never by the rank. Two incoming
     severity scales disagree about which end is bad, which is why the ONE ordering
     is computed in a class the harness executes and this file only paints it. */
  .fbadge.b-disabled, .fbadge.b-shadow, .fbadge.b-notarmed { color: #d7a13b; }
  .fbadge.b-quarantined, .fbadge.b-orphan, .fbadge.b-diverged { color: #d9534f; }
  .fbadge.b-match { color: #5cb85c; }
</style>
</head>
<body>
<header>
  <h1>RiskGuard — rule inventory</h1>
  <span class="meta" id="hdr">connecting…</span>
  <!-- P1-125. The second of the system row's indicators. The guard's mode and the
       COPIER's are different switches -- separate since P3-34, so the sim can copy
       while the guard observes -- and this page showed only the first. An operator
       told about "mode shadow" reads it as covering both. -->
  <span class="meta" id="hdrcopier">copier …</span>
  <span style="flex:1"></span>
  <span class="meta" id="taken"></span>
  <button id="refresh">Refresh</button>
</header>

<!-- P2-138. UI_REDESIGN_DESIGN.md section 4: "one window, two panes, zero nav tabs".
     The left column lists ENTITIES -- groups with their followers nested, then
     unlinked accounts -- and selecting one drives the inspector on the right.
     Section 4.2 kills top-level navigation tabs explicitly, "recorded so nobody
     re-adds them", and the operator re-confirmed section 4 against a live challenge
     on 2026-08-16 after calling the stacked-sections page "cluttered". What they
     were reacting to is the ABSENCE of section 4, not section 4. -->
<main class="shell">
  <div id="fleetpane">
    <div class="note" id="fleettree">loading the fleet…</div>
  </div>

  <div id="inspector">
    <div id="banner"></div>
    <!-- P2-127 slice 4. Section 4 decision 4: "Selecting nothing shows the system row
         (feed / guard / copier) -- which is where P3-34's two-or-three-indicator
         problem lives."

         ⚠️ THREE CELLS, NEVER ONE. Section 2.1 records the reason in a line: "P3-34
         (open) | the copier is ENFORCING regardless of guard mode | a single 'armed'
         indicator would be a lie". MEASURED on this box 2026-08-17: the guard was
         mode "shadow" and armed -- evaluating everything, enforcing nothing -- while
         the copier was mode "live" with isActing TRUE, in the same process at the
         same instant. Every rank and badge below comes from BridgeSystemRow. -->
    <div id="systemrow"></div>
    <!-- Outcomes live OUTSIDE #copier on purpose. The page re-renders every 5s, so
         anything written inside a section is gone before it can be read. -->
    <div id="outcome"></div>
    <!-- The config form is OUTSIDE everything load() touches, and load() runs every
         5 seconds. A form re-rendered under the operator's cursor loses whatever
         they were halfway through typing, which is the same reason #outcome sits
         here. It is fetched once and on an explicit Reload, never on the poll. -->
    <!-- P2-127 slice 3. Section 4's three tabs, and the ONLY tabs in the app: they
         are inside the inspector and scoped to the selection, not the top-level nav
         that section 4.2 killed and recorded "so nobody re-adds them".

         ⚠️ EVERY BADGE AND RANK HERE COMES FROM BridgeInspectorTabs, over
         /api/ui/inspector. This file is in no test build and no mutation battery, so
         a decision taken here is a decision nothing can check -- which is what
         P2-127's entry warns grows "a third untested surface, and it will be the one
         the operator actually uses". The strip renders what the route returns. -->
    <div id="tabstrip"></div>
    <div id="tabpanes">
      <div id="config"></div>
      <div id="copier"></div>
      <!-- P2-126. The copier's global mode and the group cards live OUTSIDE #copier
           for the same reason #config and #newrel do: the copier pane re-renders
           every 5s and its innerHTML would wipe anything nested inside it. Mode is
           global (it affects every relationship) and groups are the only grouping,
           so both render on every poll, never on a click. -->
      <div id="copiermode" class="filter"></div>
      <div id="groups"></div>
      <!-- P2-126. The create-relationship form lives OUTSIDE #copier for the same
           reason #config does: the copier pane re-renders every 5s, and a form
           rebuilt under the operator's cursor loses whatever they were typing. It
           is rendered on load and on Refresh, never on the poll. -->
      <div id="newrel"></div>
      <div id="content"></div>
    </div>
  </div>

  <!-- P2-127 slice 4. Section 4's bottom region: "EVENTS -- filtered to selection",
       and the last unbuilt part of that layout.

       ⚠️ ALWAYS VISIBLE, never behind a tab. Section 4.2 killed top-level nav tabs
       because they hide state, and this pane is where a box-wide problem shows up
       without being looked for -- so it sits below both panes rather than inside
       the inspector.

       ⚠️ AND IT IS FILTERED WITHOUT BEING BLINDED. Events logged with no account
       (LogFromComponent) or with the literal "SYSTEM" (LogEvent) are shown WHATEVER
       is selected, because ATM_MONITOR_NO_DISPATCHER, ATM_BRACKET_RESTORE_FAILED and
       every ERROR are logged that way -- and clicking an account is the normal way to
       use this page. BridgeEventsView decides all of it; measured input: the log was
       43,766,928 bytes for one day, 86% of it per-tick telemetry. -->
  <div id="eventspane">
    <div class="paneheader">EVENTS<span id="eventscope" class="scopenote"></span></div>
    <div id="events" class="note">loading recent events…</div>
  </div>
</main>

<script>
"use strict";

// The token is asked for ONCE and kept in localStorage. It is never put in the
// URL: a query-string token lands in browser history and in every referrer, and
// the bridge deliberately exempts only this page's static files from auth --
// every /api/ call below still carries the Bearer header.
function token() {
  var t = localStorage.getItem("nt8_token");
  if (!t) {
    t = window.prompt("Bridge token (stored locally, sent as a Bearer header):");
    if (t) localStorage.setItem("nt8_token", t.trim());
  }
  return t;
}

// The five states, worst first. This order is the page's only opinion, and it
// matches the enum's own: a rule nothing evaluates and a rule whose evidence
// set is empty both mean "this is not protecting you", and they are the two
// this whole inventory was built to surface.
var ORDER = {
  ConfiguredNotEvaluated: 0,
  Inert: 1,
  EvaluatedNotEnforcing: 2,
  Enforcing: 3,
  Disabled: 4
};

var LABEL = {
  ConfiguredNotEvaluated: "NOT EVALUATED",
  Inert: "INERT",
  EvaluatedNotEnforcing: "not enforcing",
  Enforcing: "enforcing",
  Disabled: "off"
};

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// For text going inside an ATTRIBUTE, where esc() is not enough: it leaves quotes
// alone, and these strings carry values from a hand-edited config file. An
// unrecognised copier mode is quoted back to the operator verbatim (that is the
// point of P1-87), so `"` in a mode name would otherwise close the attribute early.
function escAttr(s) {
  return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ⚠️ null and 0 are DIFFERENT and must render differently. A rule with no
// numeric limit shows a dash; a rule whose limit is genuinely zero shows 0.
// The core serializer preserves the null specifically so this is possible --
// collapsing them is the defect that made the copier's latency read 0ms when
// nothing had ever been measured.
function num(v) {
  return (v === null || v === undefined) ? "&mdash;" : esc(v);
}

function ruleRows(rules) {
  var sorted = rules.slice().sort(function (a, b) {
    var d = (ORDER[a.state] === undefined ? 9 : ORDER[a.state])
          - (ORDER[b.state] === undefined ? 9 : ORDER[b.state]);
    return d !== 0 ? d : a.name.localeCompare(b.name);
  });
  return sorted.map(function (r) {
    return '<tr>'
      + '<td class="state s-' + esc(r.state) + '">' + esc(LABEL[r.state] || r.state) + '</td>'
      + '<td>' + esc(r.name) + '<div class="path">' + esc(r.configPath) + '</div></td>'
      + '<td class="num">' + num(r.currentValue) + '</td>'
      + '<td class="num">' + num(r.limit) + '</td>'
      + '<td class="num">' + esc(r.evidenceCount) + '</td>'
      + '<td>' + (r.note
          ? '<div class="note clamp" title="click to expand">' + esc(r.note) + '</div>'
          : '') + '</td>'
      + '</tr>';
  }).join("");
}

function table(rules) {
  return '<table><thead><tr>'
    + '<th>State</th><th>Rule</th><th style="text-align:right">Now</th>'
    + '<th style="text-align:right">Limit</th><th style="text-align:right">Evidence</th>'
    + '<th>Note</th>'
    + '</tr></thead><tbody>' + ruleRows(rules) + '</tbody></table>';
}

// ── the fleet ────────────────────────────────────────────────────────────────
// The real box has 96 accounts. 96 x 25 = 2400 rows is not an inventory, it is a
// wall, so the fleet lists one row per account and you open the one you care
// about. The counts come from the bridge's summary view, which core derives from
// the same rows the detail view shows -- so the two cannot disagree.
var showAll = false;      // the empty-account filter; the hidden count is always stated
var openAccount = null;   // the account currently expanded, if any. NOT `open` -- that shadows window.open.

function stateChips(counts) {
  return Object.keys(ORDER)
    .filter(function (k) { return counts[k]; })
    .map(function (k) {
      return '<span class="chip s-' + k + '">' + counts[k] + ' ' + esc(LABEL[k]) + '</span>';
    }).join(" ");
}

function renderFleet(data) {
  var banner = document.getElementById("banner");
  var content = document.getElementById("content");

  if (data.error) {
    banner.innerHTML = '<div class="banner bad">' + esc(data.error) + '</div>';
    content.innerHTML = "";
    document.getElementById("hdr").textContent = "";
    return;
  }

  var canAct = data.mode === "live" && data.isArmed;
  document.getElementById("hdr").innerHTML =
    'mode <b>' + esc(data.mode) + '</b> &middot; '
    + (data.isArmed ? 'armed' : '<b>DISARMED</b>') + ' &middot; '
    + (canAct ? 'can act' : '<b>cannot act</b>');
  document.getElementById("taken").textContent = "taken " + esc(data.takenUtc) + " UTC";

  // Shadow mode is the state this box has lived in, and "armed" is the word an
  // operator reads as "protected". Say it on the page rather than leaving it to
  // be inferred from a wall of amber.
  banner.innerHTML = canAct ? ""
    : '<div class="banner">The guard is <b>' + esc(data.mode) + '</b>'
      + (data.isArmed ? '' : ' and <b>disarmed</b>')
      + '. It observes and logs; <b>no rule below can act</b>, whatever its row says.</div>';

  var html = "";

  // Reported once, and FIRST, because these are broken for every account equally
  // -- a property of the build, not of an account. Shown even with zero accounts,
  // which is the whole of P2-83.
  if (data.unevaluatedRules && data.unevaluatedRules.length) {
    html += '<section><h2>Configured, and evaluated by nothing ('
         + data.unevaluatedRules.length + ')</h2>' + table(data.unevaluatedRules)
         + '<div class="legend">These appear in the config file and no code reads them. '
         + 'Shown once rather than per account because they are broken for every account '
         + 'equally.</div></section>';
  }

  if (!data.accounts || !data.accounts.length) {
    html += '<section><h2>Accounts</h2><div class="banner">No accounts are loaded, so no '
         + 'per-account rules can be reported. This is <b>not</b> the same as "nothing is '
         + 'wrong" &mdash; the rules above are still evaluated by nothing.</div></section>';
    content.innerHTML = html;
    return;
  }

  // ── WHICH ACCOUNTS TO SHOW ────────────────────────────────────────────────
  // The live box lists 96 accounts and 88 of them have zero cash and zero net
  // liquidation: expired prop accounts the connection still reports. Rendering
  // all of them is 92% noise and buries the one funded account.
  //
  // ⚠️ But hiding an account that is actually live would hide RISK, which is the
  // one direction this design refuses to fail in. So:
  //   * the count hidden is ALWAYS stated, never silent;
  //   * an excluded or locked-out account is NEVER hidden, whatever its equity --
  //     those are states you need to see precisely when they are unexpected;
  //   * any account that has traded today stays, even at zero equity, because
  //     equity can lag a reconnect.
  // "Nothing to show" and "nothing is wrong" must not look the same, here too.
  var all = data.accounts;
  var shown = showAll ? all : all.filter(function (a) {
    return a.accountEquity !== 0 || a.tradesToday > 0 || a.isExcluded || a.isLockedOut;
  });
  var hidden = all.length - shown.length;

  // P2-138. A selection in the fleet pane wins over the empty-account filter: an
  // operator who clicked an account wants THAT account, and one with no equity and
  // no trades would otherwise be hidden by a filter they did not touch -- selecting
  // a row and getting an empty table is indistinguishable from a broken page.
  if (selectedAccount) {
    shown = all.filter(function (a) { return a.accountName === selectedAccount; });
    hidden = all.length - shown.length;
  }

  if (selectedAccount) {
    html += '<div class="filter note">Inspecting <b>' + esc(selectedAccount)
         + '</b> — ' + hidden + ' of ' + all.length + ' accounts hidden by the fleet '
         + 'selection.</div>';
  } else if (hidden > 0 || showAll) {
    html += '<div class="filter note">'
         + (showAll
            ? 'Showing all ' + all.length + ' accounts. <a id="tog">Hide the empty ones</a>'
            : hidden + ' of ' + all.length + ' accounts hidden — no equity and no trades '
              + 'today. <a id="tog">Show all</a>')
         + '</div>';
  }

  // Worst first, then by name. Same ordering as the rules themselves, for the
  // same reason.
  var accounts = shown.slice().sort(function (a, b) {
    var d = (ORDER[a.worst] === undefined ? 9 : ORDER[a.worst])
          - (ORDER[b.worst] === undefined ? 9 : ORDER[b.worst]);
    return d !== 0 ? d : a.accountName.localeCompare(b.accountName);
  });

  html += '<section><h2>Accounts (' + accounts.length + ' of ' + all.length + ')</h2>'
       + '<table><thead><tr><th>Worst</th><th>Account</th><th style="text-align:right">Equity</th>'
       + '<th>Rules</th><th></th></tr></thead><tbody>';

  accounts.forEach(function (a) {
    var tags = [];
    if (a.isExcluded) tags.push("EXCLUDED");
    if (a.isLockedOut) tags.push("LOCKED OUT");
    html += '<tr class="acct" data-account="' + esc(a.accountName) + '">'
         + '<td class="state s-' + esc(a.worst) + '">' + esc(LABEL[a.worst] || a.worst) + '</td>'
         + '<td>' + esc(a.accountName)
         + (tags.length ? ' <span class="note">' + esc(tags.join(" · ")) + '</span>' : '')
         + '</td>'
         + '<td class="num">' + (a.accountEquity
             ? '$' + a.accountEquity.toLocaleString(undefined, { maximumFractionDigits: 0 })
             : '<span class="note">&mdash;</span>') + '</td>'
         + '<td>' + stateChips(a.counts || {}) + '</td>'
         + '<td class="note">' + (openAccount === a.accountName ? "hide" : "show " + a.ruleCount) + '</td>'
         + '</tr>';
    if (openAccount === a.accountName) {
      html += '<tr><td colspan="5" id="detail"><div class="note">loading…</div></td></tr>';
    }
  });

  html += '</tbody></table></section>';
  content.innerHTML = html;
  wireNotes(content);

  var tog = document.getElementById("tog");
  if (tog) tog.addEventListener("click", function () { showAll = !showAll; load(); });

  Array.prototype.forEach.call(document.querySelectorAll("tr.acct"), function (row) {
    row.addEventListener("click", function () {
      openAccount = (openAccount === row.dataset.account) ? null : row.dataset.account;
      load();
    });
  });

  if (openAccount) loadDetail(openAccount);
}

// Notes are clamped to two lines and expand on click. They are not noise -- 11 of
// the 14 that appear sit on RED or DISABLED rows, where the note is the only part
// that says what to do about it -- but 25 paragraphs at once is a wall.
function wireNotes(root) {
  Array.prototype.forEach.call((root || document).querySelectorAll(".note.clamp"), function (n) {
    n.addEventListener("click", function (e) {
      e.stopPropagation();
      n.classList.toggle("clamp");
    });
  });
}


// ── the copier ───────────────────────────────────────────────────────────────
// A different question from the guard half: not "is this limit protecting me?"
// but "is the follower actually where the leader is?".
//
// ⚠️ Rows are sorted by the `severity` the SERVER puts on each one, never by the
// verdict name or an enum value. CopierConformance's own integers are historical
// (Idle=0 … Quarantined=5), so sorting by them would put a healthy Idle row first
// and an ORPHAN -- leader flat, follower still holding a live position nothing is
// managing -- below a quarantined one. That ordering is stated once, in core.

var VLABEL = {
  Orphan: "ORPHAN", Diverged: "DIVERGED", Quarantined: "QUARANTINED",
  Shadow: "shadow", Match: "match", Idle: "idle"
};

// P2-126. The sizing modes the engine accepts, in the enum's order. The page
// renders the CURRENT mode as selected and offers the rest; an unrecognised
// stored mode stays visible and selected (same rule as the guard config's
// selects -- a value outside the list is the most interesting thing on the row).
var SIZING_MODES = ["QuantityRatio", "FixedLot", "NetLiquidationRatio",
                    "AvailableCashPercent", "PerTickerMatrix"];
function sizingOptions(current) {
  var cur = String(current || "QuantityRatio");
  var seen = false, h = "";
  for (var i = 0; i < SIZING_MODES.length; i++) {
    if (SIZING_MODES[i] === cur) seen = true;
    h += '<option' + (SIZING_MODES[i] === cur ? ' selected' : '') + '>'
       + esc(SIZING_MODES[i]) + '</option>';
  }
  if (!seen) h += '<option selected>' + esc(cur) + '</option>';
  return h;
}

// ⚠️ A metric with no samples is NOT zero. These are session-scoped and reset on
// a recompile, so `0 ms` for a copier that has never filled is the P1-22 defect
// restored -- it was once misdiagnosed as a broken measurement and cost two
// sessions. No samples renders as a dash.
function metric(m, unit) {
  if (!m || !m.measured) return '<span class="note">not measured</span>';
  return esc(m.value.toFixed(unit === "ms" ? 0 : 2)) + " " + unit
       + ' <span class="note">(' + m.samples + ')</span>';
}

function position(side, qty) {
  if (!side || side === "Flat" || !qty) return '<span class="note">flat</span>';
  return esc(side === "Long" ? "L" : "S") + " " + esc(qty);
}

// P1-125. The copier third of the system row, rendered from `system` in the same
// payload as the rows. Nothing here decides anything: severity, headline and detail
// are all folded in core by CopierStatusView out of the same relationships and groups
// the table below renders, so this page and the WPF window cannot disagree about
// whether the copier is copying.
//
// It runs BEFORE the error and empty branches on purpose. "The bridge did not answer"
// and "the copier is disabled" are both states in which nothing is being copied, and
// the header must not go blank -- a blank indicator reads as "fine".
function renderCopierSystem(sys) {
  var el = document.getElementById("hdrcopier");
  if (!el) return;

  if (!sys) {
    el.innerHTML = 'copier <b class="sev-critical">unknown</b>';
    el.title = "The bridge did not report the copier's state, so this page cannot say "
             + "whether anything is being copied.";
    return;
  }

  el.innerHTML = 'copier <b class="sev-' + esc(sys.severity) + '">' + esc(sys.mode) + '</b>'
    + ' &middot; ' + (sys.isActing ? 'acting' : '<b class="sev-' + escAttr(sys.severity) + '">not acting</b>')
    + (sys.configConflicts
        ? ' &middot; <b class="sev-warn">' + sys.configConflicts + ' conflict'
          + (sys.configConflicts === 1 ? '' : 's') + '</b>'
        : '');
  el.title = (sys.headline || "") + " " + (sys.detail || "");
}

function copierBanner(sys) {
  // Silent when the copier is doing what it is configured to do. A banner that is
  // always there is furniture, and the operator stops reading it -- the same reason
  // the fleet banner appears only when the guard cannot act.
  if (!sys || sys.severity === "ok") return "";
  // info is stated, not shouted: "live, but nothing is armed" is a fact about the
  // configuration, not a fault, and painting it the same amber as a shadow copier is
  // how amber stops meaning anything. Only warn and critical get a colour.
  var cls = sys.severity === "critical" ? " bad" : (sys.severity === "warn" ? " warn" : "");
  return '<div class="banner' + cls + '">'
       + '<b>' + esc(sys.headline || "") + '</b>'
       + '<div class="detail">' + esc(sys.detail || "") + '</div></div>';
}

// P2-138. Section 4's left pane.
//
// The selection is what the inspector is filtered by. Null means "nothing selected",
// which section 4 decision 4 says shows the system row -- i.e. everything, unfiltered.
// It is a NAME rather than an index because the tree is rebuilt from a fresh payload
// every five seconds and an index would silently select a different account.
var selectedAccount = null;

// The tree arrives already ordered and already ranked. BridgeFleetView owns the ONE
// ordering -- 199 lines with a mutation battery, because two incoming severity scales
// disagree about which end is bad -- so this renders the list it is given, in the order
// it is given, and re-derives nothing. The badge is coloured by the NAME core sent.
//
// P2-127 follow-up. A dormant account (Connection == null, no position, no order, no
// guard finding) is hidden by default behind a stated count and a toggle. The flag is
// DATA the route classified; this renderer only skips it.
// Operator decision 2026-08-22: dormant accounts are blown evals that will never come
// back unless reset. They are ALWAYS hidden -- the toggle to show them is removed.
var showDormant = false;

function fleetNodeHtml(n) {
  var sel = (n.kind === "account" && n.name === selectedAccount) ? " sel" : "";
  var badgeClass = "b-" + String(n.badge || "").toLowerCase().replace(/[^a-z]/g, "");
  var role = n.role ? '<span class="meta">' + esc(n.role) + "</span>" : "";

  var html = '<li><div class="fnode' + sel + '" data-kind="' + escAttr(n.kind)
           + '" data-name="' + escAttr(n.name) + '">'
           + '<span class="fname">' + esc(n.name) + "</span>"
           + role
           + (n.badge ? '<span class="fbadge ' + badgeClass + '">' + esc(n.badge) + "</span>" : "")
           + (n.dormant ? '<span class="meta" title="not delivered by the broker on this login">dormant</span>' : "")
           + "</div>";

  var kids = n.children || [];
  if (kids.length) {
    html += '<ul class="fkids">';
    for (var i = 0; i < kids.length; i++) {
      var kid = kids[i];
      // P2-127 follow-up. Dormant accounts are hidden unless the toggle is on. The
      // count is stated above the tree, so a hidden set is never silent.
      if (kid.dormant) continue;
      html += fleetNodeHtml(kid);
    }
    html += "</ul>";
  }
  return html + "</li>";
}

function renderFleetTree(data) {
  var el = document.getElementById("fleettree");
  if (!el) return;

  // P2-126. Kept so the group cards can build their follower picker from the same
  // account list the tree renders, without a second fetch.
  lastFleet = (data && data.fleet) || lastFleet;

  var nodes = data && data.fleet;
  if (!nodes || !nodes.length) {
    // Not an absence: a page that renders nothing here reads as "no accounts",
    // and this box has 97. Same reason the copier indicator never goes blank.
    el.innerHTML = '<div class="note">The bridge sent no fleet tree.</div>';
    return;
  }

  // Operator decision 2026-08-22: dormant accounts are blown evals that will never come
  // back unless reset. They are ALWAYS hidden -- the toggle to show them is removed.
  var dormant = Number(data.dormantCount) || 0;
  var total = Number(data.accountCount) || 0;
  var shown = total - dormant;
  var filter = '<div class="filter note">'
    + (dormant > 0
        ? 'Showing ' + shown + ' of ' + total + ' accounts — ' + dormant
          + ' dormant (blown evals, hidden).'
        : 'Showing ' + shown + ' accounts.')
    + '</div>';

  var html = filter + "<ul>";
  for (var i = 0; i < nodes.length; i++) html += fleetNodeHtml(nodes[i]);
  html += "</ul>";

  if (selectedAccount) {
    html += '<div class="note" style="margin-top:10px">Inspecting <b>'
          + esc(selectedAccount) + "</b> — <a id=\"fclear\">show the whole fleet</a></div>";
  }
  el.innerHTML = html;

  var clear = document.getElementById("fclear");
  if (clear) clear.addEventListener("click", function () {
    selectedAccount = null;
    load();
  });

  var rows = el.querySelectorAll(".fnode");
  for (var j = 0; j < rows.length; j++) {
    rows[j].addEventListener("click", function () {
      if (this.getAttribute("data-kind") !== "account") return;
      var name = this.getAttribute("data-name");
      // Clicking the selected row clears it, so the operator can always get back
      // to the whole fleet without hunting for a control.
      selectedAccount = (selectedAccount === name) ? null : name;
      load();
    });
  }
}

// The selection filter, stated once. Both halves of the inspector consult THIS --
// a second copy of "does this row belong to the selected account?" is how the two
// panes come to disagree about what is selected.
function selectedHas(leader, follower) {
  if (!selectedAccount) return true;
  return leader === selectedAccount || follower === selectedAccount;
}

function renderCopier(data) {
  renderFleetTree(data);
  renderMode(data);

  var el = document.getElementById("copier");
  if (!el) return;

  renderCopierSystem(data.system);

  if (data.error) {
    el.innerHTML = '<section><h2>Copier</h2>' + copierBanner(data.system)
                 + '<div class="banner bad">' + esc(data.error) + '</div></section>';
    return;
  }

  // "The copier mirrors nothing" and "the copier is not loaded" are different
  // answers and the payload distinguishes them, so the page must too.
  if (!data.rows || !data.rows.length) {
    el.innerHTML = '<section><h2>Copier</h2>' + copierBanner(data.system)
                 + '<div class="banner">The copier is loaded and has '
                 + '<b>no relationships</b>. Nothing is being mirrored.</div></section>';
    return;
  }

  // P2-138. The selection filter. `all` is kept so the heading can say how many rows
  // were hidden -- a table that silently shrinks when something is selected reads as
  // relationships having disappeared, which is the defect d0a9e27 fixed for the 89
  // empty accounts.
  var all = data.rows.slice().sort(function (a, b) {
    return (a.severity - b.severity) ||
           a.followerAccountName.localeCompare(b.followerAccountName);
  });
  var rows = all.filter(function (r) {
    return selectedHas(r.leaderAccountName, r.followerAccountName);
  });

  lastCopierRows = rows;

  var heading = selectedAccount
    ? 'Copier (' + rows.length + ' of ' + all.length + ', for ' + esc(selectedAccount) + ')'
    : 'Copier (' + rows.length + ')';

  if (!rows.length) {
    el.innerHTML = '<section><h2>' + heading + '</h2>' + copierBanner(data.system)
                 + '<div class="banner"><b>' + esc(selectedAccount) + '</b> is in no copier '
                 + 'relationship. Nothing is mirrored to or from it.</div></section>';
    return;
  }

  var html = '<section><h2>' + heading + '</h2>'
    + copierBanner(data.system)
    + '<table><thead><tr>'
    + '<th>Verdict</th><th>Leader &rarr; Follower</th><th>Instrument</th>'
    + '<th>Leader</th><th>Expected</th><th>Actual</th>'
    + '<th>Latency</th><th>Slippage</th><th>Note</th><th>Actions</th>'
    + '</tr></thead><tbody>';

  rows.forEach(function (r, i) {
    // P3-122/P1-125. `notEnforcingLabel` replaces the two flags this page used to
    // derive for itself ("disabled", "not armed"), and it is strictly more than they
    // were: those two named the relationship's own terms only, so a row under a
    // `shadow` copier -- copying nothing at all -- carried no flag whatsoever. The
    // label and its sentence come from ONE ordering in CopierEnforcementView, ranked
    // by what BINDS. `clamped` survives because it is not a refusal: that row copies.
    var flags = [];
    if (r.notEnforcingLabel) flags.push(r.notEnforcingLabel);
    if (r.expectedIsClamped) flags.push("clamped by MaxPositionSize");

    var mismatch = r.actualSide !== r.expectedSide || r.actualQuantity !== r.expectedQuantity;

    html += '<tr>'
      + '<td class="state v-' + esc(r.verdict) + '">' + esc(VLABEL[r.verdict] || r.verdict) + '</td>'
      + '<td>' + esc(r.leaderAccountName) + ' &rarr; ' + esc(r.followerAccountName)
      + (r.groupName ? '<div class="path">group ' + esc(r.groupName) + '</div>' : '')
      + '<div class="path">' + esc(r.sizingMode) + ' &times;' + esc(r.effectiveRatio) + '</div></td>'
      + '<td>' + (r.instrumentFullName ? esc(r.instrumentFullName) : '<span class="note">&mdash;</span>') + '</td>'
      + '<td class="pos">' + position(r.leaderSide, r.leaderQuantity) + '</td>'
      + '<td class="pos">' + position(r.expectedSide, r.expectedQuantity) + '</td>'
      + '<td class="pos' + (mismatch ? ' bad' : '') + '">' + position(r.actualSide, r.actualQuantity) + '</td>'
      + '<td>' + metric(r.latency, "ms") + '</td>'
      + '<td>' + metric(r.slippage, "ticks") + '</td>'
      // The full sentence is the tooltip rather than the cell: it is 30 words, it is
      // identical on every row whenever the GLOBAL mode is the cause, and a table that
      // repeats one paragraph per row buries the row that differs (P2-41's shape). The
      // banner above states it once; here it is one click of hover away.
      + '<td class="note"' + (r.notEnforcingReason ? ' title="' + escAttr(r.notEnforcingReason) + '"' : '')
      + '>' + esc(r.quarantineReason || flags.join(" · ")) + '</td>'
      // The release button appears only on a quarantined row, because an action
      // that is always offered and usually meaningless trains you to ignore it.
      + '<td>'
      + '<button class="act" data-row="' + i + '" data-do="toggle">'
      + (r.isEnabled ? "Disable" : "Enable") + '</button>'
      // P2-126. Arm/disarm is section 4 decision 3's first "frequent action", and it
      // is the one that makes a relationship actually live. Arming is a separate
      // deliberate act -- never a side effect of create or enable -- so it is its own
      // button, and it is the ONLY write on this page that sends confirmLive:true.
      + '<button class="act' + (r.armedForLive ? ' warn' : '') + '" data-row="' + i + '" data-do="arm">'
      + (r.armedForLive ? "Disarm" : "Arm") + '</button>'
      + (r.isQuarantined
          ? '<button class="act warn" data-row="' + i + '" data-do="release">Release</button>'
          : '')
      // P2-126. Delete is a row action, not an inspector action: it is the inverse
      // of create, and create is a frequent action. It is never offered on a row
      // whose follower is holding a position -- the confirmation states the
      // consequence, and a delete that strands a live position is the one thing
      // this page must not make easy.
      + '<button class="act warn" data-row="' + i + '" data-do="delete">Delete</button>'
      // P2-126. Ratio and sizing mode are section 4 decision 3's "frequent actions
      // inline on the row". The rowedit is hidden until the operator opens it, so
      // the Actions cell does not grow a control per row.
      + '<div class="rowedit" id="rowedit-' + i + '" style="display:none">'
      + '<input class="ratio" data-row="' + i + '" data-field="ratio" value="'
      + esc(r.effectiveRatio || "") + '" title="ratio">'
      + '<select class="sizing" data-row="' + i + '" data-field="sizing">'
      + sizingOptions(r.sizingMode) + '</select>'
      // P2-126. The set-rarely scalar config, inline on the row (section 4 decision 3
      // puts set-rarely config in the inspector; these three are the scalars that fit
      // a row without a dictionary editor). Each is a DIFF field, so PerTickerRatios
      // and CustomSymbolMappings survive (P?-65's rule).
      + '<input class="maxpos" data-row="' + i + '" data-field="maxpos" value="'
      + esc(r.maxPositionSize === undefined ? "" : r.maxPositionSize) + '" title="max position size">'
      + '<input class="slippage" data-row="' + i + '" data-field="slippage" value="'
      + esc(r.maxSlippageTicks === undefined ? "" : r.maxSlippageTicks) + '" title="max slippage ticks (0 = off)">'
      + '<label class="autosym"><input type="checkbox" class="autosym" data-row="' + i + '" data-field="autosym"'
      + (r.autoSymbolConversion ? ' checked' : '') + '> auto symbol</label>'
      // P2-126. The two dictionary fields, as "KEY=VALUE" textareas. A dynamic key-value
      // form is the P2-41 shape (per-account repetition hides the one finding); a textarea
      // shows the whole map at once and the page parses a diff back on save.
      + '<div class="rowdict"><label>Per-ticker ratios (SYM=ratio)</label>'
      + '<textarea class="perticker" data-row="' + i + '" rows="2" placeholder="NQ=2.0">'
      + esc((r.perTickerRatioLines || []).join("\n")) + '</textarea></div>'
      + '<div class="rowdict"><label>Symbol mappings (LEADER=FOLLOWER)</label>'
      + '<textarea class="symmap" data-row="' + i + '" rows="2" placeholder="MNQ=NQ">'
      + esc((r.symbolMappingLines || []).join("\n")) + '</textarea></div>'
      + '<button class="act" data-row="' + i + '" data-do="saveedit">Save</button>'
      + '</div>'
      + '<button class="act" data-row="' + i + '" data-do="edit">Edit</button>'
      + '</td>'
      + '</tr>';
  });

  el.innerHTML = html + '</tbody></table></section>';
  wireActions(rows);
}

// ── P2-126: create, groups, mode ─────────────────────────────────────────────
// The backend accepts 14 copier actions; the page used to dispatch 2. These are
// the rest, and they follow the same three rules as every write above: a request
// names only what it changes, nothing is armed from here, and every confirmation
// states the consequence.

// The account list for the create form and the group follower picker. Built from
// the fleet tree the route already sends, so this page never names a file path
// and never constructs a domain object (section 5's one rule).
function fleetAccountNames(data) {
  var names = [];
  function walk(nodes) {
    (nodes || []).forEach(function (n) {
      if (n.kind === "account") names.push(n.name);
      walk(n.children);
    });
  }
  walk(data && data.fleet);
  return names;
}

// The create-relationship form. Rendered into #newrel on load and Refresh, never
// on the 5s poll -- the same reason #config sits outside the poll.
function renderNewRel(data) {
  var el = document.getElementById("newrel");
  if (!el) return;
  var names = fleetAccountNames(data);
  if (!names.length) {
    el.innerHTML = '<section><h2>New relationship</h2><div class="banner">The bridge '
      + 'sent no fleet tree, so there is no account list to build a relationship '
      + 'from.</div></section>';
    return;
  }
  var opts = names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join("");
  el.innerHTML = '<section><h2>New relationship</h2>'
    + '<div class="legend">A new relationship lands <b>disabled</b> and <b>not armed</b>. '
    + 'Arming is a separate deliberate act, never a side effect of creation.</div>'
    + '<table class="cfg"><tbody>'
    + '<tr><td>Leader</td><td><select id="newrel-leader">' + opts + '</select></td></tr>'
    + '<tr><td>Follower</td><td><select id="newrel-follower">' + opts + '</select></td></tr>'
    + '<tr><td>Sizing mode</td><td><select id="newrel-sizing">' + sizingOptions("QuantityRatio")
    + '</select></td></tr>'
    + '<tr><td>Ratio</td><td><input id="newrel-ratio" value="1.0" class="ratio"></td></tr>'
    + '<tr><td>Max position size</td><td><input id="newrel-maxpos" value="10" class="ratio"></td></tr>'
    + '</tbody></table>'
    + '<div class="cfgbar"><button id="newrel-save">Create relationship</button></div>'
    + '</section>';
  document.getElementById("newrel-save").addEventListener("click", createRelationship);
}

function createRelationship() {
  var leader = document.getElementById("newrel-leader").value;
  var follower = document.getElementById("newrel-follower").value;
  if (!leader || !follower) {
    outcome("bad", "Both a leader and a follower are required.");
    return;
  }
  if (leader === follower) {
    outcome("bad", "Leader and follower cannot be the same account.");
    return;
  }
  var ratio = parseFloat(document.getElementById("newrel-ratio").value);
  if (isNaN(ratio) || ratio <= 0) {
    outcome("bad", "Ratio must be a positive number.");
    return;
  }
  var maxPos = parseInt(document.getElementById("newrel-maxpos").value, 10);
  if (isNaN(maxPos) || maxPos <= 0) maxPos = 10;

  // isEnabled:false and NO armedForLive field. The engine merges, so omitting
  // armedForLive leaves the stored value alone -- and for a new relationship the
  // default is false. Arming is a separate deliberate act.
  dispatch({
    action: "set",
    leaderAccount: leader,
    followerAccount: follower,
    sizingMode: document.getElementById("newrel-sizing").value,
    quantityRatio: ratio,
    maxPositionSize: maxPos,
    isEnabled: false
  }, "Created " + leader + " -> " + follower + " (disabled, not armed).");
}

// The group cards: one per group, with its followers, add/remove, and delete.
// Groups are the only grouping (section 4 decision 2), so this is where a
// relationship that belongs to a group is managed.
//
// ⚠️ THE GROUPS ARRIVE PASCALCASE. `get_groups` is serialised with the default
// JsonConvert settings (GroupName, LeaderAccountName, FollowerAccounts), unlike
// the snapshot's camelCase rows. Both spellings are read so a casing change on
// either side cannot blank the cards.
function renderGroups(data) {
  var el = document.getElementById("groups");
  if (!el) return;
  var groups = (data && data.groups) || [];
  var names = fleetAccountNames(data);
  var html = '<section><h2>Copier groups</h2>';
  if (!groups.length) {
    html += '<div class="banner">No groups. A 1:1 pair is a group of one, and the '
      + 'relationships above are keyed by their leader.</div></section>';
    el.innerHTML = html;
    return;
  }
  groups.forEach(function (g) {
    var gname = g.groupName || g.GroupName || "";
    var leader = g.leaderAccountName || g.LeaderAccountName || "";
    var followers = (g.followerAccounts || g.FollowerAccounts || []).slice().sort();
    html += '<div class="groupcard" data-group="' + escAttr(gname) + '">'
      + '<b>' + esc(gname) + '</b>'
      + ' <span class="note">leader ' + esc(leader) + '</span>'
      + (g.isEnabled === false ? ' <span class="bad">disabled</span>' : '')
      + '<ul>' + followers.map(function (f) {
          return '<li>' + esc(f)
            + ' <button class="act warn" data-group="' + escAttr(gname)
            + '" data-follower="' + escAttr(f) + '" data-do="rmfollower">remove</button></li>';
        }).join("") + '</ul>'
      + '<div class="cfgbar">'
      + '<select class="addfollower" data-group="' + escAttr(gname) + '">'
      + names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join("")
      + '</select>'
      + '<button class="act" data-group="' + escAttr(gname) + '" data-do="addfollower">Add follower</button>'
      + '<button class="act warn" data-group="' + escAttr(gname) + '" data-do="delgroup">Delete group</button>'
      + '</div></div>';
  });
  html += '</section>';
  el.innerHTML = html;
  wireGroups();
}

function wireGroups() {
  Array.prototype.forEach.call(document.querySelectorAll("#groups button"), function (b) {
    var group = b.getAttribute("data-group");
    var doWhat = b.getAttribute("data-do");
    if (doWhat === "addfollower") {
      b.addEventListener("click", function () {
        var sel = document.querySelector('#groups select[data-group="' + group + '"]');
        var follower = sel ? sel.value : "";
        if (!follower) return;
        dispatch({ action: "add_follower_to_group", groupName: group, followerAccount: follower },
                 "Added " + follower + " to group \"" + group + "\".");
      });
    } else if (doWhat === "rmfollower") {
      var follower = b.getAttribute("data-follower");
      b.addEventListener("click", function () {
        if (!window.confirm("Remove " + follower + " from group \"" + group + "\"?")) return;
        dispatch({ action: "remove_follower_from_group", groupName: group, followerAccount: follower },
                 "Removed " + follower + " from group \"" + group + "\".");
      });
    } else if (doWhat === "delgroup") {
      b.addEventListener("click", function () {
        if (!window.confirm("DELETE group \"" + group + "\"? Its followers are removed from "
          + "the group; the accounts themselves are untouched.")) return;
        dispatch({ action: "remove_group", groupName: group },
                 "Deleted group \"" + group + "\".");
      });
    }
  });
}

// The copier's global mode. A mode you cannot observe is a mode you cannot trust
// (P1-69's class), so the select is rendered from the system cell the route sends
// and the write is a POST-only action.
//
// ⚠️ IDEMPOTENT ON PURPOSE. The poll re-renders this every 5s, and a select
// rebuilt under an open dropdown closes it -- so the renderer only rewrites the
// DOM when the mode it would show has actually changed. Same rule as #config:
// a control the operator is interacting with must not be rebuilt under them.
function renderMode(data) {
  var el = document.getElementById("copiermode");
  if (!el) return;
  var sys = data && data.system;
  var cur = (sys && sys.mode) || "live";
  var shown = el.getAttribute("data-mode");
  if (shown === cur && el.querySelector("#copiermode-sel")) return;
  el.setAttribute("data-mode", cur);
  el.innerHTML = '<span class="meta">copier mode</span> '
    + '<select id="copiermode-sel">'
    + ["live", "shadow", "disabled"].map(function (m) {
        return '<option' + (m === cur ? ' selected' : '') + '>' + m + '</option>';
      }).join("")
    + '</select> '
    + '<button class="act" id="copiermode-set">Set</button>';
  document.getElementById("copiermode-set").addEventListener("click", function () {
    var next = document.getElementById("copiermode-sel").value;
    if (next === cur) return;
    if (!window.confirm("Set the copier's GLOBAL mode to \"" + next + "\"?\n\n"
      + "This affects every relationship. Entering \"live\" runs preflight and is "
      + "refused if it fails.")) return;
    dispatch({ action: "set_mode", mode: next },
             "Set the copier's global mode to \"" + next + "\".");
  });
}

// ── writing ──────────────────────────────────────────────────────────────────
// The first thing on this page that CHANGES anything. Three rules, and they are
// the whole design:
//
//  1. A request names ONLY the fields it is changing. The engine merges it over
//     what is stored, so a field this page has never heard of survives. Sending
//     a whole row back is how PerTickerRatios, CustomSymbolMappings and
//     MaxSlippageTicks were wiped twice before (P?-65) -- a surface cannot see
//     those fields, so a round trip through it silently resets them to defaults.
//
//  2. Nothing is armed from here. `armedForLive` is never in any request below,
//     which under merge semantics means the stored value is left alone. Arming
//     is a decision that belongs where the operator can see the account.
//
//  3. Every confirmation states the CONSEQUENCE, not the action. "Disable this
//     relationship?" tells you nothing you did not already know. What matters is
//     whether the follower is holding something right now.

var lastCopierRows = [];   // for deriving group membership from the detail
var lastFleet = null;      // P2-126. the fleet tree as last sent, for the group pickers

function apiPost(url, body) {
  var t = token();
  if (!t) return Promise.reject(new Error("No token entered, so nothing can be written."));
  return fetch(url, {
    method: "POST",
    headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    if (r.status === 401) {
      localStorage.removeItem("nt8_token");
      throw new Error("The bridge rejected that token. Reload to enter it again.");
    }
    if (!r.ok) throw new Error("The bridge returned HTTP " + r.status + ".");
    return r.json();
  });
}

function outcome(kind, text, reason) {
  var el = document.getElementById("outcome");
  if (!el) return;
  el.innerHTML = '<div class="banner ' + kind + '">'
    + '<button class="dismiss" onclick="document.getElementById(\'outcome\').innerHTML=\'\'">dismiss</button>'
    + esc(text)
    + (reason ? '<span class="reason">' + esc(reason) + '</span>' : '')
    + '</div>';
}

// What a follower is holding RIGHT NOW, in words, or null if it is flat. This is
// the sentence that makes a disable confirmation worth reading.
function holdingNow(r) {
  if (!r.actualSide || r.actualSide === "Flat" || !r.actualQuantity) return null;
  return r.followerAccountName + " is currently holding "
       + (r.actualSide === "Long" ? "LONG " : "SHORT ") + r.actualQuantity
       + (r.instrumentFullName ? " " + r.instrumentFullName : "");
}

function groupSiblings(groupName) {
  var names = {};
  lastCopierRows.forEach(function (r) {
    if (r.groupName === groupName) names[r.followerAccountName] = true;
  });
  return Object.keys(names);
}

function confirmToggle(r, nextEnabled) {
  var what = r.groupName
    ? 'group "' + r.groupName + '"'
    : r.leaderAccountName + " -> " + r.followerAccountName;

  var lines = [(nextEnabled ? "ENABLE " : "DISABLE ") + what + "?"];

  // A grouped row is not a per-follower switch, and pretending otherwise is the
  // kind of quiet lie this whole UI exists to stop. Say who else it moves.
  if (r.groupName) {
    var sibs = groupSiblings(r.groupName);
    if (sibs.length > 1) {
      lines.push("");
      lines.push("This follower is managed by a GROUP, so this affects all "
                 + sibs.length + " of its followers: " + sibs.join(", "));
    }
  }

  if (!nextEnabled) {
    var held = holdingNow(r);
    lines.push("");
    lines.push(held
      ? held + ".\n\nDisabling stops copying, so the leader's EXIT will not reach it either. "
              + "That position becomes yours to close by hand."
      : "The follower is flat, so nothing is stranded by this.");
  }

  return window.confirm(lines.join("\n"));
}

function confirmRelease(r) {
  return window.confirm(
    "RELEASE the quarantine on " + r.leaderAccountName + " -> " + r.followerAccountName + "?\n\n"
    + "It was quarantined because:\n" + (r.quarantineReason || "(no reason recorded)") + "\n\n"
    + "Releasing resumes copying immediately. Whatever caused this can happen again on the "
    + "next entry -- the threshold that tripped is unchanged.");
}

// One dispatcher, so there is exactly one place that builds a request and one
// place that reads the answer. `refused` is the engine declining on purpose and
// is NOT an error: it comes back with the reason, which is the whole of UI7.
function dispatch(body, describe) {
  apiPost("/api/copier/config", body)
    .then(function (res) {
      if (res && res.refused) {
        outcome("bad", "Refused. Nothing was changed.", res.reason);
      } else if (res && res.success) {
        outcome("ok", describe);
      } else if (res && res.success === false) {
        // The engine declined WITHOUT a `refused` flag. add_follower_to_group and
        // remove_follower_from_group return success:false on a P1-76 overlap (the
        // follower already has a direct relationship) and log the reason to the
        // copier log, but the bridge does not echo it. Say what came back so the
        // operator is not left guessing whether the change happened.
        outcome("bad", "The bridge reported the change was NOT applied.",
                JSON.stringify(res));
      } else {
        outcome("bad", "The bridge did not report success, and did not say it refused.",
                JSON.stringify(res));
      }
      load();
    })
    .catch(function (e) { outcome("bad", e.message); });
}

function toggleRow(r, nextEnabled) {
  if (!confirmToggle(r, nextEnabled)) return;
  var verb = nextEnabled ? "Enabled " : "Disabled ";
  if (r.groupName) {
    dispatch({ action: "set_group", groupName: r.groupName, isEnabled: nextEnabled },
             verb + 'group "' + r.groupName + '".');
  } else {
    dispatch({ action: "set", leaderAccount: r.leaderAccountName,
               followerAccount: r.followerAccountName, isEnabled: nextEnabled },
             verb + r.leaderAccountName + " -> " + r.followerAccountName + ".");
  }
}

function releaseRow(r) {
  if (!confirmRelease(r)) return;
  // isQuarantined:false only. The engine clears QuarantineReason itself, because
  // a reason without a quarantine is stale data and that invariant belongs there.
  dispatch({ action: "set", leaderAccount: r.leaderAccountName,
             followerAccount: r.followerAccountName, isQuarantined: false },
           "Released the quarantine on " + r.leaderAccountName + " -> " + r.followerAccountName + ".");
}

// P2-126. Arm/disarm a relationship. The ONLY write on this page that sends
// confirmLive:true, because arming is the one action that turns a relationship
// from "copies to simulation" into "places real orders on a live follower". The
// engine's ApplyArmingGate refuses an arm without confirmLive, so omitting it
// here would make the button a silent no-op -- the exact P1-88 shape.
//
// ⚠️ A grouped row arms the GROUP, not the follower: a follower managed by a group
// has no ArmedForLive of its own, and pretending otherwise is the quiet lie this
// page exists to stop. The confirmation says who else it moves.
function armRow(r) {
  var nextArmed = !r.armedForLive;
  var what = r.groupName
    ? 'group "' + r.groupName + '"'
    : r.leaderAccountName + " -> " + r.followerAccountName;

  var lines = [(nextArmed ? "ARM " : "DISARM ") + what + "?"];
  if (r.groupName) {
    var sibs = groupSiblings(r.groupName);
    if (sibs.length > 1) {
      lines.push("");
      lines.push("This follower is managed by a GROUP, so this affects all "
                 + sibs.length + " of its followers: " + sibs.join(", "));
    }
  }
  if (nextArmed) {
    lines.push("");
    lines.push("Arming makes this relationship place REAL orders on a live follower. "
      + "The engine runs preflight and refuses if it fails.");
  } else {
    lines.push("");
    lines.push("Disarming stops it placing live orders; it copies to SIMULATION "
      + "followers only until re-armed.");
  }
  if (!window.confirm(lines.join("\n"))) return;

  // Same group/direct split as toggleRow: a grouped follower has no direct
  // relationship, so arming it means arming the GROUP (set_group), not inventing
  // a direct relationship under it.
  var body = r.groupName
    ? { action: "set_group", groupName: r.groupName, armedForLive: nextArmed, confirmLive: true }
    : { action: "set", leaderAccount: r.leaderAccountName,
        followerAccount: r.followerAccountName, armedForLive: nextArmed, confirmLive: true };
  dispatch(body, (nextArmed ? "Armed " : "Disarmed ") + what + ".");
}

// P2-126. Delete a relationship. The confirmation states the CONSEQUENCE, not the
// action: a delete is permanent, and if the follower is holding a position the
// leader's exits will no longer reach it.
function deleteRow(r) {
  var held = holdingNow(r);
  var lines = ["DELETE the relationship " + r.leaderAccountName + " -> "
               + r.followerAccountName + "?"];
  if (r.groupName) {
    lines.push("");
    lines.push("This follower is managed by group \"" + r.groupName + "\". Deleting the "
               + "relationship removes it from the group.");
  }
  lines.push("");
  lines.push(held
    ? held + ".\n\nDeleting stops copying permanently. The leader's EXIT will not reach "
            + "it either, so that position becomes yours to close by hand."
    : "The follower is flat, so nothing is stranded by this.");
  if (!window.confirm(lines.join("\n"))) return;
  dispatch({ action: "remove", leaderAccount: r.leaderAccountName,
             followerAccount: r.followerAccountName },
           "Deleted " + r.leaderAccountName + " -> " + r.followerAccountName + ".");
}

// P2-126. Toggle the inline ratio/sizing editor on a row. Only one row's editor is
// open at a time, so the Actions cell does not grow a control per row.
function toggleRowEdit(i) {
  var open = document.getElementById("rowedit-" + i);
  if (!open) return;
  var wasOpen = open.style.display !== "none";
  Array.prototype.forEach.call(document.querySelectorAll(".rowedit"), function (e) {
    e.style.display = "none";
  });
  if (!wasOpen) open.style.display = "";
}

// P2-126. Save the inline ratio/sizing edit. A DIFF, like every write on this page:
// only the fields the operator changed are named, so PerTickerRatios,
// CustomSymbolMappings and MaxSlippageTicks survive (P?-65's rule).
//
// ⚠️ FIXEDLOT IS SIZED OFF FixedLotSize, NOT QuantityRatio. The engine's
// ComputeEffectiveRatio returns 0.0 for FixedLot and the copy quantity is
// `rel.FixedLotSize` (TradeCopierEngine.cs:1727), so switching a row to FixedLot
// without also writing FixedLotSize would copy 1 lot no matter what ratio the
// operator typed. The ratio input doubles as the lot size when the mode is
// FixedLot, exactly as the WPF window's create form does.
function saveRowEdit(r) {
  var idx = lastCopierRows.indexOf(r);
  var ratioEl = document.querySelector('#rowedit-' + idx + ' input.ratio');
  var sizingEl = document.querySelector('#rowedit-' + idx + ' select.sizing');
  var maxposEl = document.querySelector('#rowedit-' + idx + ' input.maxpos');
  var slippageEl = document.querySelector('#rowedit-' + idx + ' input.slippage');
  var autosymEl = document.querySelector('#rowedit-' + idx + ' input.autosym');
  if (!ratioEl || !sizingEl) return;

  var body = { action: "set", leaderAccount: r.leaderAccountName,
               followerAccount: r.followerAccountName };
  var ratio = parseFloat(ratioEl.value);
  var mode = sizingEl.value;
  if (mode === "FixedLot") {
    if (!isNaN(ratio) && ratio > 0) body.fixedLotSize = Math.round(ratio);
    // The engine sizes FixedLot copies off FixedLotSize, and the stored
    // FixedLotMode flag is what the WPF window and the config file both read.
    // Sending it keeps the two spellings of "this is a fixed-lot row" in step.
    body.fixedLotMode = true;
  } else {
    if (!isNaN(ratio) && ratio > 0) body.quantityRatio = ratio;
    if (r.sizingMode === "FixedLot") body.fixedLotMode = false;
  }
  if (mode && mode !== r.sizingMode) body.sizingMode = mode;

  // P2-126. The set-rarely scalars, each a DIFF field. A blank input means "leave
  // it alone", not "write zero" -- writing zero would reset a stored value the
  // operator never touched, which is P?-65's rule in miniature.
  if (maxposEl) {
    var maxpos = parseInt(maxposEl.value, 10);
    if (!isNaN(maxpos) && maxpos > 0) body.maxPositionSize = maxpos;
  }
  if (slippageEl) {
    var slip = parseFloat(slippageEl.value);
    if (!isNaN(slip) && slip >= 0) body.maxSlippageTicks = slip;
  }
  if (autosymEl) {
    // Only send it when it DIFFERS from the stored value, so the "nothing to
    // change" guard below still fires when the operator opened the editor and
    // changed nothing. Sending it unconditionally would make every save a write.
    if (autosymEl.checked !== !!r.autoSymbolConversion) {
      body.autoSymbolConversion = autosymEl.checked;
    }
  }

  // P2-126. The two dictionary fields, parsed from "KEY=VALUE" lines. A blank line
  // is skipped; a malformed line is refused rather than silently dropped, because
  // dropping a ticker rule the operator typed is the P1-23 "config must not lie"
  // shape. An empty textarea means "clear the map" -- the engine's merge treats an
  // explicit empty object as a wipe (ClearCollectionsNamedIn), which is the only
  // way to remove a ticker rule without deleting the relationship.
  var pertickerEl = document.querySelector('#rowedit-' + idx + ' textarea.perticker');
  var symmapEl = document.querySelector('#rowedit-' + idx + ' textarea.symmap');
  if (pertickerEl) {
    // Only send when the text DIFFERS from the stored lines, so the "nothing to
    // change" guard below still fires when the operator opened the editor and
    // changed nothing. Sending an unchanged map would make every save a write.
    var storedPerticker = (r.perTickerRatioLines || []).join("\n");
    if (pertickerEl.value !== storedPerticker) {
      var parsed = parseKeyValueLines(pertickerEl.value, true);
      if (parsed === null) {
        outcome("bad", "Per-ticker ratios: each line must be SYMBOL=number (e.g. NQ=2.0).");
        return;
      }
      body.perTickerRatios = parsed;
    }
  }
  if (symmapEl) {
    var storedSymmap = (r.symbolMappingLines || []).join("\n");
    if (symmapEl.value !== storedSymmap) {
      var parsedMap = parseKeyValueLines(symmapEl.value, false);
      if (parsedMap === null) {
        outcome("bad", "Symbol mappings: each line must be LEADER=FOLLOWER (e.g. MNQ=NQ).");
        return;
      }
      body.customSymbolMappings = parsedMap;
    }
  }

  if (Object.keys(body).length <= 3) {
    outcome("bad", "Nothing to change. Set a ratio, a sizing mode, or a limit first.");
    return;
  }
  dispatch(body, "Updated " + r.leaderAccountName + " -> " + r.followerAccountName + ".");
}

// P2-126. Parse "KEY=VALUE" lines into an object. `numeric` controls whether the
// value must be a number (per-ticker ratios) or is a string (symbol mappings).
// Returns null on a malformed line so the caller can refuse the whole write.
function parseKeyValueLines(text, numeric) {
  var out = {};
  var lines = String(text || "").split("\n");
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var eq = line.indexOf("=");
    if (eq <= 0) return null;
    var key = line.slice(0, eq).trim();
    var val = line.slice(eq + 1).trim();
    if (!key || !val) return null;
    if (numeric) {
      var n = parseFloat(val);
      if (isNaN(n)) return null;
      out[key] = n;
    } else {
      out[key] = val;
    }
  }
  return out;
}

function wireActions(rows) {
  Array.prototype.forEach.call(document.querySelectorAll("button.act"), function (b) {
    var r = rows[parseInt(b.getAttribute("data-row"), 10)];
    if (!r) return;
    var doWhat = b.getAttribute("data-do");
    if (doWhat === "toggle") {
      b.addEventListener("click", function () { toggleRow(r, !r.isEnabled); });
    } else if (doWhat === "arm") {
      b.addEventListener("click", function () { armRow(r); });
    } else if (doWhat === "release") {
      b.addEventListener("click", function () { releaseRow(r); });
    } else if (doWhat === "delete") {
      b.addEventListener("click", function () { deleteRow(r); });
    } else if (doWhat === "edit") {
      b.addEventListener("click", function () { toggleRowEdit(parseInt(b.getAttribute("data-row"), 10)); });
    } else if (doWhat === "saveedit") {
      b.addEventListener("click", function () { saveRowEdit(r); });
    }
  });
}

// ======================================================================
//  The editable guard config.
//
//  WHAT IT DELIBERATELY DOES NOT SHOW. The live payload is 7,276 bytes, and
//  most of it is not an operator knob: AccountFirmMap is ~120 account->plan
//  rows, FirmProfiles is 8 plans x 12 fields, plus WindowsET and Profiles.
//  Rendering those as inputs would bury the twenty numbers somebody actually
//  changes under a hundred they never do -- the P2-41 shape, where per-account
//  repetition hides the one finding. They are reported as counts instead, and
//  the form SAYS it is partial, because a form showing twenty fields reads as
//  a config that has twenty fields.
//
//  WHY EVERY REQUEST IS A DIFF. Same rule as the copier above: a request names
//  ONLY the fields it is changing, and the engine merges it over what is
//  stored (P2-41). Here it is load-bearing rather than tidy -- a full-object
//  round trip through a form that cannot see AccountFirmMap would reset ~120
//  account mappings to nothing, which is P?-65 with two more zeros.
//
//  WHY THE SELECTS ARE SELECTS. Three of these fields have a whitelist that
//  something downstream enforces, and a free text box is how you get the value
//  it refuses:
//    * Mode -- preflight refuses anything outside shadow/live (P1-72, P2-93).
//    * StopGuard.OnMissing -- preflight refuses anything but AutoStop/Flatten
//      (P1-87), and the fallback used to be a silent Flatten.
//    * Alerts.MinSeverity -- F-6's floor is FAIL-OPEN: RankOf answers 0 for an
//      unrecognised string, so a typo'd "warn" pushes the ENTIRE audit stream
//      and the channel gets muted. The config is hand-edited JSON today, which
//      is exactly why a typo is the expected input.
//  ⚠️ These lists are hand-typed HERE and enforced THERE. That is the P1-72
//  shape and the only honest thing to say about it is that the refusal is the
//  real gate -- the select narrows the mistake, it does not prevent it.
// ======================================================================

// path -> label. Order is the order rendered; "" starts a new group.
var CFG_FIELDS = [
  ["", "Mode and arming"],
  ["Mode", "Mode", "select", ["shadow", "live"]],
  ["MinShadowSessions", "Shadow sessions before live", "int"],
  ["EnableWindowGate", "Trading-window gate", "bool"],
  ["AuditIntervalSeconds", "Audit sweep interval (s)", "int"],

  ["", "Loss limits"],
  ["PnLRules.DailyLossLimit", "Daily loss limit ($)", "num"],
  ["PnLRules.TrailingDrawdown", "Trailing drawdown ($)", "num"],
  ["PnLRules.LockoutMinutes", "Lockout after a breach (min)", "int"],

  ["", "Position sizing"],
  ["Sizing.MaxContractsPerAccount", "Max contracts / account", "int"],
  ["Sizing.MaxContractsAggregate", "Max contracts / aggregate", "int"],
  ["Sizing.ExpectedCopies", "Expected copies", "int"],

  ["", "Overtrading"],
  ["Overtrading.MaxTradesPerSession", "Max trades / session", "int"],
  ["Overtrading.MaxConsecutiveLosses", "Max consecutive losses", "int"],
  ["Overtrading.MaxOrdersPerSecond", "Max orders / second", "int"],
  ["Overtrading.CooldownMinutes", "Cooldown (min)", "int"],
  ["Overtrading.LockoutMinutes", "Lockout (min)", "int"],

  ["", "Stop guard"],
  ["StopGuard.OnMissing", "Action on a missing stop", "select", ["Flatten", "AutoStop"]],
  ["StopGuard.StopAttachSeconds", "Grace before it acts (s)", "int"],
  ["StopGuard.MaxAutoStopAttempts", "Max auto-stop attempts", "int"],

  ["", "Alerts"],
  ["Alerts.Enabled", "Push alerts", "bool"],
  ["Alerts.MinSeverity", "Minimum severity", "select", ["info", "warning", "critical"]]
];

var loadedCfg = null;   // the config as last READ, for diffing

function dig(obj, path) {
  var parts = path.split("."), v = obj;
  for (var i = 0; i < parts.length; i++) {
    if (v === null || typeof v !== "object") return undefined;
    v = v[parts[i]];
  }
  return v;
}

// A dotted path back into a nested body, creating only what it must. This is
// what keeps a request a DIFF: {"PnLRules":{"TrailingDrawdown":2000}} touches
// one leaf and the merge leaves DailyLossLimit and LockoutMinutes alone.
function plant(obj, path, value) {
  var parts = path.split("."), o = obj;
  for (var i = 0; i < parts.length - 1; i++) {
    if (!o[parts[i]]) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
}

function cfgInput(path, kind, options, value) {
  var id = 'cf_' + path.replace(/\./g, '_');
  if (kind === "select" || kind === "bool") {
    var opts = kind === "bool" ? ["true", "false"] : options;
    var cur = kind === "bool" ? String(!!value) : String(value === undefined ? "" : value);
    var seen = false, h = '<select id="' + id + '" data-path="' + esc(path) + '" data-kind="' + kind + '">';
    for (var i = 0; i < opts.length; i++) {
      if (opts[i].toLowerCase() === cur.toLowerCase()) seen = true;
      h += '<option' + (opts[i].toLowerCase() === cur.toLowerCase() ? ' selected' : '') + '>' + esc(opts[i]) + '</option>';
    }
    // ⚠️ A stored value this page does not offer must stay VISIBLE and stay
    // SELECTED. Dropping it would silently rewrite the operator's config to
    // whatever happened to be first the next time they saved something else --
    // and a value outside the list is the single most interesting thing on the
    // row, because it is what preflight is about to refuse.
    if (!seen && cur !== "") {
      h += '<option selected>' + esc(cur) + '</option>';
    }
    return h + '</select>' + (seen || cur === "" ? '' : ' <span class="bad">not a value the guard accepts</span>');
  }
  return '<input id="' + id + '" data-path="' + esc(path) + '" data-kind="' + kind
       + '" value="' + esc(String(value === undefined ? "" : value)) + '">';
}

function renderConfig(data) {
  var el = document.getElementById("config");
  if (!el) return;

  if (data && data.error) {
    el.innerHTML = '<section><h2>Configuration</h2><div class="banner bad">'
      + esc(data.error) + '</div></section>';
    return;
  }
  var cfg = data && data.config;
  if (!cfg) {
    el.innerHTML = '<section><h2>Configuration</h2><div class="banner bad">The bridge '
      + 'answered without a config object, so there is nothing to edit. That is not an '
      + 'empty configuration -- it is an unreadable one.</div></section>';
    return;
  }
  loadedCfg = cfg;

  var html = '<section><h2>Configuration</h2>'
    + '<table class="cfg"><thead><tr><th>Setting</th><th>Value</th><th>Stored</th>'
    + '<th>Path</th></tr></thead><tbody>';

  CFG_FIELDS.forEach(function (f) {
    if (f[0] === "") {
      html += '<tr class="grp"><td colspan="4">' + esc(f[1]) + '</td></tr>';
      return;
    }
    var v = dig(cfg, f[0]);
    html += '<tr><td>' + esc(f[1]) + '</td>'
          + '<td>' + cfgInput(f[0], f[2], f[3], v) + '</td>'
          + '<td class="was">' + (v === undefined ? '<span class="bad">absent</span>' : esc(String(v))) + '</td>'
          + '<td class="k">' + esc(f[0]) + '</td></tr>';
  });

  html += '</tbody></table>'
    + '<div class="cfgbar">'
    + '<button id="cfgsave">Review and save</button>'
    + '<button id="cfgreload">Reload</button>'
    + '<span class="note">' + cfgOmitted(cfg) + '</span>'
    + '</div></section>';

  el.innerHTML = html;
  wireConfig();
}

// ⚠️ Say what is NOT on the form. Twenty inputs read as "this is the config",
// and the operator's model of their own protection is the thing this whole page
// exists to keep correct.
function cfgOmitted(cfg) {
  var bits = [];
  var map = cfg.FirmMirror && cfg.FirmMirror.AccountFirmMap;
  var plans = cfg.FirmMirror && cfg.FirmMirror.FirmProfiles;
  if (map) bits.push(Object.keys(map).length + " account-to-plan mappings");
  if (plans) bits.push(Object.keys(plans).length + " firm plans");
  if (cfg.WindowsET) bits.push(cfg.WindowsET.length + " trading windows");
  if (cfg.Profiles) bits.push(cfg.Profiles.length + " per-account overrides");
  if (!bits.length) return "";
  return "Not editable here, and left untouched by a save: " + bits.join(", ") + ".";
}

function wireConfig() {
  var save = document.getElementById("cfgsave");
  var reload = document.getElementById("cfgreload");
  if (save) save.addEventListener("click", saveConfig);
  if (reload) reload.addEventListener("click", loadConfig);

  Array.prototype.forEach.call(document.querySelectorAll(".cfg [data-path]"), function (i) {
    var initial = i.value;
    var mark = function () {
      if (i.value === initial) i.classList.remove("dirty");
      else i.classList.add("dirty");
    };
    i.addEventListener("input", mark);
