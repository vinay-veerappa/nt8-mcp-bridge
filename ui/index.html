    i.addEventListener("change", mark);
  });
}

function loadConfig() {
  api("/api/riskguard/config")
    .then(renderConfig)
    .catch(function (e) { renderConfig({ error: e.message }); });
}

// Read every input, parse it, and report the FIRST unparseable one -- without
// having touched anything.
//
// ⚠️ THIS IS P1-117 ON THE OTHER WRITER, AND IT IS THE WHOLE POINT OF DOING IT
// THIS WAY. RiskGuardWindow.OnSaveConfigClick does `var cfg = _addOn.Config`
// -- a LIVE reference -- and then applies seventeen assignments to it with
// thirteen bare Parse calls in between. A typo throws partway down, everything
// above it is already live on the running guard, and the operator is shown
// "Failed to parse settings", which means nothing happened. Parse into locals,
// validate the whole set, THEN send: a failure here is a failure that changed
// nothing, which is what the message already claims.
function collectConfig() {
  var body = {}, changes = [], bad = null;

  Array.prototype.forEach.call(document.querySelectorAll(".cfg [data-path]"), function (i) {
    if (bad) return;
    var path = i.getAttribute("data-path");
    var kind = i.getAttribute("data-kind");
    var raw = i.value;
    var stored = dig(loadedCfg, path);
    var val;

    if (kind === "bool") {
      val = (raw === "true");
    } else if (kind === "select") {
      val = raw;
    } else {
      var s = String(raw).trim();
      if (s === "") { bad = { path: path, raw: raw, why: "is empty" }; return; }
      var n = Number(s);
      if (!isFinite(n)) { bad = { path: path, raw: raw, why: "is not a number" }; return; }
      if (kind === "int" && Math.floor(n) !== n) {
        bad = { path: path, raw: raw, why: "must be a whole number" }; return;
      }
      val = n;
    }

    // Unchanged fields are not sent. That is what makes the request a diff, and
    // the diff is what leaves AccountFirmMap's ~120 rows alone.
    if (val === stored) return;
    plant(body, path, val);
    changes.push(path + ":  " + JSON.stringify(stored) + "  ->  " + JSON.stringify(val));
  });

  return { body: body, changes: changes, bad: bad };
}

function saveConfig() {
  if (!loadedCfg) {
    outcome("bad", "Nothing has been read yet, so there is nothing to compare a change against.");
    return;
  }

  var c = collectConfig();

  if (c.bad) {
    outcome("bad",
      "Nothing was sent. " + c.bad.path + " " + c.bad.why + ".",
      c.bad.path + " = " + JSON.stringify(c.bad.raw));
    return;
  }
  if (!c.changes.length) {
    outcome("ok", "Nothing has changed, so nothing was sent.");
    return;
  }

  var lines = ["Apply " + c.changes.length + " change(s) to the live guard configuration?", ""];
  lines = lines.concat(c.changes);

  // ⚠️ Arming is not on this form and a mode change is not arming -- but it is
  // still the most consequential edit here, so it gets said out loud rather
  // than sitting in a list of numbers. Going to `live` is what makes every
  // other limit on this page start flattening positions instead of noting them.
  var nextMode = dig(c.body, "Mode");
  if (nextMode) {
    lines.push("");
    lines.push(String(nextMode).toLowerCase() === "live"
      ? "MODE -> LIVE. Breaches will act on the broker instead of being observed. "
        + "The guard still has to pass preflight and be armed before that takes effect."
      : "MODE -> " + String(nextMode).toUpperCase() + ".");
  }

  lines.push("");
  lines.push("This is written to RiskGuard/config.json and hot-reloaded. It does NOT "
           + "re-run preflight, so a value the guard cannot accept leaves it disarmed at "
           + "the next restart.");

  if (!window.confirm(lines.join("\n"))) return;

  apiPost("/api/riskguard/config", c.body)
    .then(function (res) {
      // ⚠️ Read the ANSWER, not the fact that a call returned. `success: false`
      // with a reason is exactly what a validator refusal looks like, and it
      // arrives with HTTP 200 -- reporting "applied" here because the fetch
      // resolved is report-the-call-not-the-outcome, which this project has
      // shipped four times.
      if (res && res.success === false) {
        outcome("bad", "The guard REFUSED the change. Nothing was applied.",
                res.error || res.reason || res.message || JSON.stringify(res));
      } else {
        outcome("ok", "Applied " + c.changes.length + " change(s).", c.changes.join("\n"));
      }
      // Re-read either way. After a refusal this proves nothing landed; after a
      // success it shows what the merge actually stored, which is not always
      // what was sent.
      loadConfig();
    })
    .catch(function (e) {
      outcome("bad", "The change was not applied.", e.message);
      loadConfig();
    });
}

function loadCopier() {
  api("/api/copier/snapshot")
    .then(renderCopier)
    .catch(function (e) { renderCopier({ error: e.message }); });
}

function loadDetail(account) {
  api("/api/riskguard/inventory?account=" + encodeURIComponent(account))
    .then(function (d) {
      var cell = document.getElementById("detail");
      if (!cell) return;
      cell.innerHTML = (d.accounts && d.accounts.length)
        ? table(d.accounts[0].rules)
        : '<div class="note">That account is no longer reported.</div>';
      wireNotes(cell);
    })
    .catch(function (e) {
      var cell = document.getElementById("detail");
      if (cell) cell.innerHTML = '<div class="banner bad">' + esc(e.message) + '</div>';
    });
}

function api(url) {
  var t = token();
  if (!t) return Promise.reject(new Error("No token entered, so nothing can be read."));
  return fetch(url, { headers: { Authorization: "Bearer " + t } }).then(function (r) {
    if (r.status === 401) {
      localStorage.removeItem("nt8_token");
      throw new Error("The bridge rejected that token. Reload to enter it again.");
    }
    if (!r.ok) throw new Error("The bridge returned HTTP " + r.status + ".");
    return r.json();
  });
}

// P2-127 slice 3. Which pane is on screen. A NAME, not an index, and kept outside
// everything the 5s poll re-renders -- the same reason selectedAccount is a name:
// the strip is rebuilt every poll and an index would land on whatever moved into
// that slot.
var activeTab = "copier";

// ⚠️ THE PANES ARE HIDDEN, NOT UNRENDERED. Section 4.2 killed top-level tabs because
// they HIDE state; the compensation is that the strip's badges stay on screen for all
// three. Unrendering a pane would also drop the config form's in-progress edits,
// which is the hazard the #config comment above already records.
function renderTabs(data) {
  var el = document.getElementById("tabstrip");
  var tabs = (data && data.tabs) || [];
  if (!tabs.length) {
    el.innerHTML = '<div class="banner bad">The bridge returned no inspector tabs. '
      + 'Three are expected; none means the route or the fold is broken, not that '
      + 'everything is clean.</div>';
    return;
  }
  // No sorting here: section 4's order is the class's decision and it already made it.
  el.innerHTML = tabs.map(function (t) {
    var on = t.id === activeTab ? " on" : "";
    return '<div class="tab r' + Number(t.rank) + on + '" data-tab="' + esc(t.id)
      + '" title="' + esc(t.reason || "") + '"><span>' + esc(t.label || t.id)
      + '</span><span class="tbadge">' + esc(t.badge || "") + '</span></div>';
  }).join("");

  Array.prototype.forEach.call(el.querySelectorAll(".tab"), function (n) {
    n.addEventListener("click", function () {
      activeTab = n.getAttribute("data-tab");
      applyTabs();
      renderTabs(data);          // repaint so the .on class follows the click
    });
  });
  applyTabs();
}

// copier -> #copier + #newrel + #copiermode + #groups, risk -> #content (the
// per-account rule rows), rare -> #config (the set-rarely guard config, which
// section 4 puts in the inspector and nowhere else). The tab's LABEL is
// "Settings" (BridgeInspectorTabs); the ID stays "rare" so the pane mapping
// below and the route's tab ids never drift.
function applyTabs() {
  var paneOf = { copier: ["copier", "newrel", "copiermode", "groups"],
                 risk: ["content"], rare: ["config"] };
  Object.keys(paneOf).forEach(function (id) {
    paneOf[id].forEach(function (paneId) {
      var pane = document.getElementById(paneId);
      if (pane) pane.style.display = (id === activeTab) ? "" : "none";
    });
  });
}

// P2-127 slice 4. Section 4 decision 4's system row: feed / guard / copier, three
// cells, always. ⚠️ NEVER FOLDED INTO ONE "armed" light -- section 2.1 records that
// as a lie, because the copier enforces regardless of guard mode, and this box was
// measured guard-shadow / copier-live-and-acting on 2026-08-17.
function renderSystemRow(data) {
  var el = document.getElementById("systemrow");
  var cells = (data && data.system) || [];
  if (!cells.length) {
    el.innerHTML = '<div class="banner bad">The bridge returned no system row. Three '
      + 'cells are expected; none means the route or the fold is broken, not that the '
      + 'feed, the guard and the copier are all fine.</div>';
    return;
  }
  // No sorting: section 4's order is feed, guard, copier, and the class already made it.
  el.innerHTML = cells.map(function (c) {
    return '<div class="scell r' + Number(c.rank) + '" title="' + esc(c.detail || "")
      + '"><span class="slabel">' + esc(c.label || c.id) + '</span>'
      + '<span class="sbadge">' + esc(c.badge || "") + '</span></div>';
  }).join("");
}

// P2-127 slice 4. Section 4's EVENTS region. Everything shown here was decided by
// BridgeEventsView: which lines are telemetry, which repeats collapse, what the
// selection includes, and how bad each one is. This renders the list as given.
function renderEvents(data) {
  var rows = (data && data.events) || [];
  var scope = document.getElementById("eventscope");
  scope.textContent = selectedAccount
    ? "— " + selectedAccount + ", plus everything logged box-wide"
    : "— all accounts";

  var el = document.getElementById("events");
  if (!rows.length) {
    // ⚠️ SAY WHY IT IS EMPTY. The pane reads a bounded tail of a log that is 86%
    // per-tick telemetry, so "nothing here" means "nothing notable in the recent
    // tail", NOT "nothing has happened" -- and an operator who reads the second
    // meaning into a blank pane has been misled by it.
    el.className = "note";
    el.textContent = "Nothing notable in the recent log tail. Routine per-tick "
      + "telemetry (subscriptions, order and position updates) is not shown here — "
      + "it is state, and it is on the rows above.";
    return;
  }
  el.className = "";
  // No .sort() and no .reverse(): newest-first is applied by the class AFTER repeats
  // are collapsed, so re-ordering here would undo the one decision whose ORDER matters.
  el.innerHTML = '<table>' + rows.map(function (r) {
    var when = String(r.utc || "").replace("T", " ").replace(/\.\d+Z?$/, "").replace("Z", "");
    var count = Number(r.count) > 1 ? ("x" + Number(r.count)) : "";
    return '<tr class="r' + Number(r.rank) + '">'
      + '<td class="ewhen">' + esc(when) + '</td>'
      + '<td class="ewho">' + esc(r.isSystemScoped ? "system" : (r.account || "")) + '</td>'
      + '<td class="etype">' + esc(r.eventType || "") + '</td>'
      + '<td class="ecount">' + esc(count) + '</td>'
      + '<td class="emsg">' + esc(r.message || "") + '</td>'
      + '</tr>';
  }).join("") + '</table>';
}

function loadTabs() {
  var q = selectedAccount ? ("?account=" + encodeURIComponent(selectedAccount)) : "";
  api("/api/ui/inspector" + q)
    .then(function (data) {
      // One payload, three regions. Separate fetches could disagree about which
      // account is selected, and the strip would then describe one account while the
      // events pane described another.
      renderTabs(data);
      renderSystemRow(data);
      renderEvents(data);
    })
    .catch(function (e) {
      document.getElementById("tabstrip").innerHTML =
        '<div class="banner bad">Inspector tabs unavailable: ' + esc(e.message)
        + '. The panes below are unfiltered.</div>';
      // ⚠️ SAID, in both places. A stale system row and a stale events pane look
      // exactly like a quiet, healthy box -- which is the failure this page exists
      // to prevent, so neither region may keep rendering last poll's answer in
      // silence after the fetch stopped working.
      document.getElementById("systemrow").innerHTML =
        '<div class="banner bad">System row unavailable: ' + esc(e.message)
        + '. The feed, guard and copier states below are NOT current.</div>';
      var ev = document.getElementById("events");
      ev.className = "note bad";
      ev.textContent = "Events unavailable: " + e.message
        + ". This pane is not current, so an absence of events here means nothing.";
    });
}

function load() {
  api("/api/riskguard/inventory?view=summary")
    .then(renderFleet)
    .catch(function (e) { renderFleet({ error: e.message }); });
  loadCopier();
  loadTabs();
}

// P2-126. The create-relationship form is rendered once on load and once on an
// explicit Refresh, never on the 5s poll -- the same rule as #config. The flag is
// set by the refresh handler and cleared by the first render.
var renderNewRelPending = true;

function loadCopier() {
  api("/api/copier/snapshot")
    .then(function (data) {
      renderCopier(data);
      if (renderNewRelPending) {
        renderNewRel(data);
        renderNewRelPending = false;
      }
    })
    .catch(function (e) { renderCopier({ error: e.message }); });
  // P2-126. The snapshot carries rows and the system cell but not the GROUPS
  // (they are a config object, not a conformance row). Fetched separately and
  // merged onto the same payload so the group cards and the rows cannot disagree
  // about which group a follower belongs to.
  api("/api/copier/config?action=get_groups")
    .then(function (g) {
      var el = document.getElementById("groups");
      if (el) renderGroups({ groups: g.groups, fleet: lastFleet });
    })
    .catch(function (e) {
      var el = document.getElementById("groups");
      if (el) el.innerHTML = '<section><h2>Copier groups</h2><div class="banner bad">'
        + esc(e.message) + '</div></section>';
    });
}

document.getElementById("refresh").addEventListener("click", function () {
  renderNewRelPending = true;
  load();
  loadConfig();   // an explicit Refresh is the operator asking; the 5s poll is not
});
// SSE: replace the 5s poll with a server-sent event stream. The bridge's
// /api/events/stream sends a heartbeat every 5s; each heartbeat triggers a
// refetch of the three data sources (fleet, copier, inspector tabs), which
// is the same thing the old setInterval did but driven by the server.
// Config is deliberately NOT refetched (same rule as before: a form rebuilt
// under the cursor loses what was being typed).
var sseSource = null;
function startSSE() {
  var t = token();
  if (!t) return;
  try {
    sseSource = new EventSource("/api/events/stream");
    sseSource.onmessage = function () { load(); };
    sseSource.onerror = function () {
      // Reconnect after 3s. EventSource auto-reconnects, but if the token
      // expired the stream returns 401 and EventSource stops silently.
      if (sseSource) sseSource.close();
      setTimeout(startSSE, 3000);
    };
  } catch (e) {
    // EventSource not supported (very old browser) -- fall back to poll.
    setInterval(load, 5000);
  }
}
load();
loadConfig();
startSSE();
</script>
</body>
</html>
